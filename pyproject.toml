[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "reynir-correct"
version = "4.3.0"
description = "Spelling and grammar correction for Icelandic"
authors = [{ name = "Miðeind ehf.", email = "mideind@mideind.is" }]
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Natural Language :: Icelandic",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.11"
# The error patterns (pattern.py) and the tests depend on the shapes of the
# trees that GreynirEngine returns, and those change between its minor
# versions (4.2.0 moved many prepositional phrases). The range is therefore
# one minor version of reynir: widen it after running the test suite against
# the next one.
dependencies = ["reynir>=4.2.0,<4.3.0", "icegrams>=2.0.0", "typing_extensions"]

[project.urls]
Repository = "https://github.com/mideind/GreynirCorrect"

[project.optional-dependencies]
# Development dependencies, as an extra: 'uv sync --extra dev', or
# 'pip install -e ".[dev]"'. This is the same list as in the 'dev'
# dependency group below; keep the two in step.
# mypy is excluded on PyPy, where its native dependencies don't build.
dev = [
    "pytest",
    "ruff",
    "mypy; implementation_name != 'pypy'",
]
# sentence_classifier dependencies
sentence_classifier = ["transformers", "datasets", "torch"]

[dependency-groups]
# Development dependencies, as a dependency group: uv installs these
# automatically with a plain 'uv sync' (which is what CI does);
# with pip (>=25.1), use 'pip install --group dev'.
dev = [
    "pytest",
    "ruff",
    "mypy; implementation_name != 'pypy'",
]

[project.scripts]
# 'correct' command line tool
correct = "reynir_correct.main:main"

# *** Configuration of tools ***

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reynir_correct" = ["py.typed", "config/*"]

[tool.pytest.ini_options]
filterwarnings = [
    # Ignore deprecation warnings in libraries, their problem not ours
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pin the rule selection (this was ruff's default selection before
# version 0.15; later versions enable many more rules by default)
select = ["E4", "E7", "E9", "F"]
#select = ["ALL"]
# extend-select = ["E501"] # Complain about line length
# Ignore specific rules
# (we should aim to have these as few as possible)
ignore = [
    "E731", # 'E731: Do not assign a lambda expression, use a def'
]

[tool.isort]
# This forces these imports to placed at the top
known_future_library = ["__future__", "typing", "typing_extensions"]
line_length = 120
